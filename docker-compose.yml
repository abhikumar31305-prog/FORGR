version: '3.9'

services:
  # ════════════════════════════════════════════════════════════════
  # PostgreSQL Database
  # ════════════════════════════════════════════════════════════════
  db:
    image: postgres:16-alpine
    container_name: forgr_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-forgr}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-this-password}
      POSTGRES_DB: ${DB_NAME:-forgr_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-forgr}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forgr_network

  # ════════════════════════════════════════════════════════════════
  # Redis Cache & Session Store
  # ════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: forgr_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-change-this-password} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-change-this-password}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forgr_network

  # ════════════════════════════════════════════════════════════════
  # FORGR Backend API
  # ════════════════════════════════════════════════════════════════
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: forgr_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Application
      FORGR_ENV: ${FORGR_ENV:-production}
      FORGR_SECRET_KEY: ${FORGR_SECRET_KEY}
      FORGR_SEED_PASSWORD: ${FORGR_SEED_PASSWORD}
      
      # Database
      FORGR_DATABASE_URL: postgresql://${DB_USER:-forgr}:${DB_PASSWORD:-change-this-password}@db:5432/${DB_NAME:-forgr_prod}
      FORGR_DB_POOL_SIZE: ${FORGR_DB_POOL_SIZE:-20}
      FORGR_DB_MAX_OVERFLOW: ${FORGR_DB_MAX_OVERFLOW:-40}
      FORGR_DB_POOL_RECYCLE: ${FORGR_DB_POOL_RECYCLE:-1800}
      
      # Cache & Sessions
      FORGR_REDIS_URL: redis://:${REDIS_PASSWORD:-change-this-password}@redis:6379/0
      
      # CORS
      FORGR_CORS_ORIGINS: ${FORGR_CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      
      # Razorpay & Billing
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      FORGR_ALLOW_BILLING_SIMULATION: ${FORGR_ALLOW_BILLING_SIMULATION:-true}
      
      # Rate Limiting
      FORGR_RATE_LIMIT_PER_MINUTE: ${FORGR_RATE_LIMIT_PER_MINUTE:-120}
      FORGR_MAX_REQUEST_BYTES: ${FORGR_MAX_REQUEST_BYTES:-20971520}
      
      # File Uploads
      FORGR_UPLOADS_DIR: /app/uploads
      FORGR_MAX_RESUME_SIZE_MB: ${FORGR_MAX_RESUME_SIZE_MB:-10}
      
      # Notifications
      FORGR_NOTIFICATION_PROVIDER: ${FORGR_NOTIFICATION_PROVIDER:-log}
      
      # Logging
      FORGR_LOG_LEVEL: ${FORGR_LOG_LEVEL:-INFO}
      FORGR_LOG_FORMAT: ${FORGR_LOG_FORMAT:-json}
      
      # Migrations
      FORGR_RUN_MIGRATIONS: ${FORGR_RUN_MIGRATIONS:-true}
    
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - forgr_network

  # ════════════════════════════════════════════════════════════════
  # FORGR Frontend (React + Nginx)
  # ════════════════════════════════════════════════════════════════
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: forgr_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - forgr_network

networks:
  forgr_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
